<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saraiva Vapor — Pods Premium, modelos e sabores</title>
  <meta name="description" content="Saraiva Vapor — pods premium. Escolha sua marca e veja modelos, sabores e preços.">
  <meta http-equiv="Cache-Control" content="no-store">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
  <div id="cabecalho"></div>

  <div class="b44-bg" aria-hidden="true">
    <div class="v-glow-top"></div>
    <div class="v-orb a"></div>
    <div class="v-orb b"></div>
    <div class="v-orb c"></div>
    <div class="v-cena" id="v-cena">
      <img src="img/pag2.jpg" alt="">
    </div>
    <div class="v-nuvem" id="v-nuvem"></div>
    <div class="v-bafo" style="left:52%;">
      <i></i><i></i><i></i>
    </div>
    <div class="v-smoke um"></div>
    <div class="v-smoke dois"></div>
    <div class="v-bottom"></div>
  </div>

  <main id="conteudo">
    <section class="hero container">
      <span class="etiqueta">Pods premium</span>
      <h1>Escolha sua <em>marca</em></h1>
      <p>Toque na marca para ver os modelos, os sabores e os preços.</p>
    </section>

    <section id="marcas" class="container" style="padding: 30px 0 8px;">
      <div class="barra-filtro">
        <div class="chips" id="filtro-categorias"></div>
        <p class="contagem" id="contagem-catalogo"></p>
      </div>
      <div class="grid-marcas" id="grid-marcas"></div>
    </section>

    <section class="container" id="contato" style="padding: 36px 0 40px;">
      <div class="cta">
        <div style="padding: 44px 28px;" class="cta-inner">
          <h2 style="font-weight: 800;">Não sabe qual escolher?</h2>
          <p style="color: var(--texto-2); margin: 10px 0 24px; max-width: 460px;">Manda uma mensagem. A gente te ajuda a decidir o melhor modelo para você.</p>
          <a class="btn btn-whats" href="#" id="cta-whats" target="_blank" rel="noopener">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7.9 20 9 13 20 4 4 11.5 2 15a30 30 0 0 0 6 5Z"/></svg>
            Falar com a loja
          </a>
        </div>
      </div>
      <div class="aviso-idade" style="margin-top: 22px; padding: 14px; border-radius: 14px;">
        Venda proibida para menores de 18 anos. Produtos de uso adulto.
      </div>
    </section>
  </main>

  <div id="rodape"></div>
  <div id="wa-flutuante"></div>

  <script src="js/dados.js?v=2"></script>
  <script src="js/main.js?v=3"></script>
  <script src="js/cart.js?v=2"></script>
  <script>
    montarPagina("marcas");

    var cats = [];
    BANCO_DADOS.marcas.forEach(function (m) {
      if (cats.indexOf(m.categoria) === -1) cats.push(m.categoria);
    });
    cats.sort();

    var chipsEl = document.getElementById("filtro-categorias");
    chipsEl.innerHTML = ["Todos"]
      .concat(cats)
      .map(function (c) {
        var key = c === "Todos" ? "all" : c;
        var ativo = c === "Todos" ? " ativo" : "";
        return '<button class="chip' + ativo + '" data-cat="' + key + '">' + c + "</button>";
      })
      .join("");

    var catAtual = "all";
    function montarGrade() {
      var lista =
        catAtual === "all"
          ? BANCO_DADOS.marcas
          : BANCO_DADOS.marcas.filter(function (m) {
              return m.categoria === catAtual;
            });
      renderizarCards(document.getElementById("grid-marcas"), lista, marcaCardHTML);
      var prods = 0;
      lista.forEach(function (m) {
        prods += produtosDaMarca(m.slug).length;
      });
      document.getElementById("contagem-catalogo").textContent =
        prods + " produto" + (prods === 1 ? "" : "s") + " no catálogo";
    }

    chipsEl.addEventListener("click", function (e) {
      var b = e.target;
      if (b.dataset && b.dataset.cat) {
        catAtual = b.dataset.cat;
        chipsEl.querySelectorAll(".chip").forEach(function (c) {
          c.classList.toggle("ativo", c === b);
        });
        montarGrade();
      }
    });

    montarGrade();
    document.getElementById("cta-whats").href = waLink();
  </script>
</body>
</html>
