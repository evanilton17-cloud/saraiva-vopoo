<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saraiva Vapor — Produto</title>
  <meta name="description" content="Saraiva Vapor — detalhes do produto: sabores, especificações e pedido direto no WhatsApp.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
  <div id="cabecalho"></div>

  <div class="b44-bg" aria-hidden="true">
    <div class="v-glow-top"></div>
    <div class="v-orb a"></div>
    <div class="v-orb b"></div>
    <div class="v-orb c"></div>
    <div class="v-cena" id="v-cena">
      <img src="img/pag2.jpg" alt="">
    </div>
    <div class="v-nuvem" id="v-nuvem">
      <i></i><i></i><i></i><i></i>
    </div>
    <div class="v-bafo esq" style="left:73%;top:48%;">
      <i></i><i></i><i></i>
    </div>
    <div class="v-smoke um"></div>
    <div class="v-smoke dois"></div>
    <div class="v-bottom"></div>
  </div>

  <main id="conteudo" class="container pdp"></main>

  <div id="rodape"></div>
  <div id="wa-flutuante"></div>

  <script src="js/dados.js?v=2"></script>
  <script src="js/main.js?v=3"></script>
  <script src="js/cart.js?v=2"></script>
  <script>
    var slug = lerQuery("produto");
    var prod = produtoPorSlug(slug);

    var raiz = document.getElementById("conteudo");

    if (!prod) {
      raiz.innerHTML =
        '<div class="glass" style="padding:46px 30px;text-align:center;border-radius:22px;">' +
        "<h1 style='font-size:26px;margin-bottom:10px;'>Produto não encontrado</h1>" +
        '<p style="color:var(--texto-3);margin-bottom:22px;">O produto que você procura não existe ou foi removido.</p>' +
        '<a class="btn btn-primario" href="catalogo.html">Ver todos os produtos</a>' +
        "</div>";
    } else {
      var marca = marcaPorSlug(prod.marca);
      var temEstoque = produtoTemEstoque(prod);
      var descontoPct = desconto(prod);
      var g = gradiente(prod.cor1, prod.cor2);

      var saborAtual = null;
      var qtd = 1;

      function painelArte(texto, detalhe) {
        return (
          '<div class="arte">' +
          '<div style="text-align:center;">' +
          '<div class="iniciais">' +
          iniciais(prod.nome) +
          "</div>" +
          "<b>" +
          (marca ? marca.nome : prod.marca) +
          "</b>" +
          "<span>" +
          texto +
          (detalhe ? "<br>" + detalhe : "") +
          "</span>" +
          "</div>" +
          "</div>"
        );
      }

      var paineis = [
        {
          nome: "Produto",
          html: prod.imagem
            ? '<img src="' + prod.imagem + '" alt="' + prod.nome + '">'
            : painelArte("Visão do produto", "")
        },
        {
          nome: "Embalagem",
          html: painelArte("Embalagem premium", prod.puffs ? prod.puffs.toLocaleString("pt-BR") + " puffs" : "")
        },
        {
          nome: "Sabor",
          html: painelArte(
            "Sabores disponíveis",
            (prod.sabores || []).slice(0, 4).map(function (s) { return s.nome; }).join(" · ")
          )
        }
      ];

      var minis = paineis
        .map(function (p, i) {
          return (
            '<button class="pdp-mini' +
            (i === 0 ? " ativo" : "") +
            '" data-painel="' +
            i +
            '" title="' +
            p.nome +
            '" style="--g1:' +
            prod.cor1 +
            ";--g2:" +
            prod.cor2 +
            '">' +
            p.html +
            "</button>"
          );
        })
        .join("");

      var tags = "";
      tags += temEstoque
        ? '<span class="pill badge-verde">● Em estoque</span>'
        : '<span class="pill badge-vermelho">Esgotado</span>';
      if (prod.novidade) tags += '<span class="pill badge-violeta">Novo</span>';
      if (descontoPct > 0)
        tags += '<span class="pill badge-borda">' + descontoPct + "% OFF</span>";
      if (prod.puffs)
        tags += '<span class="pill badge-borda">' + prod.puffs.toLocaleString("pt-BR") + " puffs</span>";

      var precoLinha = "";
      if (prod.precoPromo) {
        precoLinha =
          '<span class="de">' +
          formatarPreco(prod.preco) +
          "</span>";
      }

      var saboresHtml = (prod.sabores || [])
        .map(function (s) {
          return (
            '<button type="button" class="opcao-sabor" data-sabor="' +
            s.nome +
            '"' +
            (s.estoque ? "" : " disabled") +
            ">" +
            s.nome +
            "</button>"
          );
        })
        .join("");

      var specs = (prod.specs || [])
        .map(function (sp) {
          return (
            '<div class="pdp-spec"><b>' +
            sp[0] +
            "</b><span>" +
            sp[1] +
            "</span></div>"
          );
        })
        .join("");

      raiz.innerHTML =
        '<nav class="pdp-trilha">' +
        '<a class="voltar-link" href="index.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Início</a>' +
        '<span>/</span>' +
        '<a href="catalogo.html">Catálogo</a>' +
        '<span>/</span>' +
        '<span class="atual">' + prod.nome + "</span>" +
        "</nav>" +

        '<div class="pdp-corpo">' +

        '<section class="pdp-galeria" style="--g1:' + prod.cor1 + ";--g2:" + prod.cor2 + '">' +
        '<div class="pdp-cartela" id="pdp-cartela">' +
        paineis[0].html +
        "</div>" +
        '<div class="pdp-minis">' + minis + "</div>" +
        "</section>" +

        '<section class="pdp-info glass">' +
        '<div class="pdp-marca">' + (marca ? marca.nome : "") + "</div>" +
        "<h1>" + prod.nome + "</h1>" +
        '<div class="pdp-tags">' + tags + "</div>" +
        '<div class="pdp-preco-area">' +
        '<div class="pdp-preco">' + precoLinha + formatarPreco(precoAtual(prod)) + "</div>" +
        (descontoPct > 0 ? '<span class="pdp-desconto">-' + descontoPct + "%</span>" : "") +
        "</div>" +

        '<div class="pdp-bloco">' +
        "<h4>Escolha o sabor</h4>" +
        '<div class="opcoes-sabor" id="opcoes-sabor">' + saboresHtml + "</div>" +
        "</div>" +

        '<div class="pdp-bloco pdp-qtd-linha">' +
        '<div class="pdp-stepper">' +
        '<button type="button" id="pdp-menos" aria-label="Diminuir">−</button>' +
        '<span class="valor" id="pdp-qtd">1</span>' +
        '<button type="button" id="pdp-mais" aria-label="Aumentar">+</button>' +
        "</div>" +
        '<div class="pdp-total"><small>Total do pedido</small><strong id="pdp-total">' +
        formatarPreco(precoAtual(prod)) +
        "</strong></div>" +
        "</div>" +

        '<div class="pdp-ctas">' +
        '<button class="btn btn-primario" id="pdp-add" ' +
        (temEstoque ? "" : "disabled") +
        '><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:8px;vertical-align:-3px;"><path d="M12 5v14M5 12h14"/></svg>Adicionar ao pedido</button>' +
        '<a class="btn btn-whats" id="pdp-whats" href="#" target="_blank" rel="noopener" ' +
        (temEstoque ? "" : 'style="opacity:.5;pointer-events:none;"') +
        '><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" style="margin-right:8px;vertical-align:-3px;"><path d="M12 2a10 10 0 0 0-8.6 15l-1.4 5 5.1-1.3A10 10 0 1 0 12 2Z"/></svg>Comprar agora</button>' +
        "</div>" +

        '<div class="pdp-specs">' + specs + "</div>" +

        '<div class="pdp-extra">' +
        "<span><svg width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z'/></svg> Compra com atendimento humano no WhatsApp</span>" +
        "<span><svg width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M20 6 9 17l-5-5'/></svg> Verificação de maioridade (18+)</span>" +
        "<span><svg width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z'/></svg> Produtos originais e lacrados</span>" +
        "</div>" +
        "</section>" +

        "</div>" +

        '<section class="relacionados" id="relacionados">' +
        '<div class="secao-titulo"><div><h2>Produtos relacionados</h2></div><a class="link-ver" href="catalogo.html">Ver tudo</a></div>' +
        '<div class="grid-produtos" id="rel-grid"></div>' +
        "</section>";

      document.title = prod.nome + " — " + (BANCO_DADOS.nomeMarca || "Saraiva Vapor");

      function atualizarTotal() {
        document.getElementById("pdp-total").textContent = formatarPreco(precoAtual(prod) * qtd);
        document.getElementById("pdp-qtd").textContent = qtd;
      }

      function linkWhats() {
        var texto =
          "Olá! 👋 Quero o *" +
          prod.nome +
          "*" +
          (saborAtual ? " — sabor " + saborAtual : "") +
          " — " +
          qtd +
          "x — " +
          formatarPreco(precoAtual(prod) * qtd) +
          ".";
        return waLink(texto);
      }

      document.getElementById("pdp-cartela").style.setProperty("--g1", prod.cor1);
      document.getElementById("pdp-cartela").style.setProperty("--g2", prod.cor2);

      document.addEventListener("click", function (e) {
        var mini = e.target.closest(".pdp-mini");
        if (mini) {
          document.querySelectorAll(".pdp-mini").forEach(function (m) {
            m.classList.remove("ativo");
          });
          mini.classList.add("ativo");
          document.getElementById("pdp-cartela").innerHTML =
            paineis[Number(mini.dataset.painel)].html;
          return;
        }
        var sabor = e.target.closest(".opcao-sabor");
        if (sabor) {
          saborAtual = sabor.dataset.sabor;
          document.querySelectorAll(".opcao-sabor").forEach(function (b) {
            b.classList.remove("ativo");
          });
          sabor.classList.add("ativo");
          return;
        }
      });

      document.getElementById("pdp-menos").addEventListener("click", function () {
        if (qtd > 1) {
          qtd--;
          atualizarTotal();
        }
      });
      document.getElementById("pdp-mais").addEventListener("click", function () {
        if (qtd < 99) {
          qtd++;
          atualizarTotal();
        }
      });

      document.getElementById("pdp-add").addEventListener("click", function () {
        if (!temEstoque) return;
        var sabor = saborAtual ||
          ((prod.sabores || []).filter(function (s) { return s.estoque; })[0] || {}).nome;
        adicionarAoCarrinho(prod.id, sabor || "", Number(qtd));
        renderizarCarrinho();
        abrirCarrinho();
      });

      document.getElementById("pdp-whats").addEventListener("click", function () {
        document.getElementById("pdp-whats").href = linkWhats();
      });

      var relacionados = BANCO_DADOS.produtos.filter(function (p) {
        return p.id !== prod.id;
      });
      relacionados.sort(function (a, b) {
        var am = a.marca === prod.marca ? 0 : 1;
        var bm = b.marca === prod.marca ? 0 : 1;
        return am - bm;
      });
      renderizarCards(
        document.getElementById("rel-grid"),
        relacionados.slice(0, 4),
        produtoCardHTML
      );
    }

    montarPagina("produto");
  </script>
</body>
</html>
