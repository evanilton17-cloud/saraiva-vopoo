<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saraiva — Como pedir</title>
  <meta name="description" content="Veja como fazer seu pedido na Saraiva: escolha seus pods, adicione ao pedido e finalize com o cupom no WhatsApp.">
  <meta name="theme-color" content="#050506">
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="canonical" href="https://saraiva-vopoo.vercel.app/contato.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Saraiva">
  <meta property="og:title" content="Saraiva — Como pedir">
  <meta property="og:description" content="Escolha seus pods, monte seu pedido no carrinho e envie o cupom pelo WhatsApp.">
  <meta property="og:image" content="https://saraiva-vopoo.vercel.app/img/hero.jpg">
  <meta property="og:url" content="https://saraiva-vopoo.vercel.app/contato.html">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <div id="cabecalho"></div>

  <main id="conteudo" class="container conteudo">
    <header class="cabecalho-pagina">
      <h1>Como pedir</h1>
      <p>Três passos simples e seu pedido já vai para o WhatsApp.</p>
    </header>

    <div class="cartao-contato glass" id="cartao-contato"></div>

    <div class="aviso-idade" style="margin-top:26px;">
      Venda restrita a maiores de 18 anos. Produtos de uso adulto. Consulte a legislação aplicável antes da compra.
    </div>
  </main>

  <div id="rodape"></div>

  <script src="js/dados.js?v=3"></script>
  <script src="js/main.js?v=6"></script>
  <script src="js/cart.js?v=3"></script>
  <script src="js/live.js?v=1"></script>
  <script>
    montarPagina("contato");

    var cartao = document.getElementById("cartao-contato");
    if (cartao) {
      cartao.innerHTML =
        '<div class="passo"><span class="passo-num">1</span><div><h4>Escolha seu produto</h4><p>Navegue pelo catálogo e escolha a marca, o sabor e a quantidade.</p></div></div>' +
        '<div class="passo"><span class="passo-num">2</span><div><h4>Adicione ao pedido</h4><p>Toque em "Adicionar ao pedido" e repita até montar tudo que você quer.</p></div></div>' +
        '<div class="passo"><span class="passo-num">3</span><div><h4>Finalize com seu cupom</h4><p>Toque em "Finalizar pedido", escolha dinheiro, cartão ou Pix, copie o cupom gerado e envie-o para a loja.</p></div></div>' +
        '<a class="btn btn-primario" href="catalogo.html" style="width:100%;">Ver catálogo</a>';
    }
  </script>
</body>
</html>
